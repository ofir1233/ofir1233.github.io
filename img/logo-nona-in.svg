<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1268.8 -16.2 2537.6 1169.6"><title>Ofir Nona</title><style>/* one story: it begins as the dot, the dot splits into the two marks, they swing open, the letters flicker on like tubes warming up, and the dot drops back to end the sentence */
.seed{fill:#139FFD;transform-box:fill-box;transform-origin:50% 50%;animation:seed .5s cubic-bezier(.3,0,.2,1) both}
.mk{fill:#139FFD;transform-box:view-box;transform-origin:0 568.6px;animation:open .78s cubic-bezier(.2,1.15,.3,1) .34s both}
.mk.l{--x:560px;--r:-16deg} .mk.r{--x:-560px;--r:16deg}
.lt{fill:#171b20;animation:flick .46s linear both;animation-delay:calc(.78s + var(--i) * .11s)}
.dot{fill:#139FFD;transform-box:fill-box;transform-origin:50% 50%;animation:drop .62s cubic-bezier(.3,1.5,.4,1) 1.5s both}
.ring{fill:none;stroke:#139FFD;stroke-width:22;transform-box:fill-box;transform-origin:50% 50%;animation:ring .7s ease-out 1.72s both}
@keyframes seed{0%{transform:scale(0)}55%{transform:scale(1.25)}75%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes open{0%{opacity:0;transform:translateX(var(--x)) rotate(var(--r)) scale(.2)}18%{opacity:1}100%{opacity:1;transform:none}}
@keyframes flick{0%{opacity:0;fill:#139FFD}12%{opacity:1}20%{opacity:.15}34%{opacity:1}44%{opacity:.4}58%{opacity:1;fill:#139FFD}100%{opacity:1;fill:#171b20}}
@keyframes drop{0%{opacity:0;transform:translateY(-260px) scale(.6)}30%{opacity:1}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:0;transform:scale(1)}8%{opacity:.7}100%{opacity:0;transform:scale(1.8)}}
@media (prefers-reduced-motion: reduce){.seed,.ring{display:none}.mk,.lt,.dot{animation:none}}
</style><circle class="seed" cx="0" cy="568.6" r="110"/>
