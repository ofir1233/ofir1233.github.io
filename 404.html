:root {

}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: clip; }

.nav ul li:last-child { margin-left: 6px; }

  .nav ul li:last-child a, .nav ul li:last-child a:hover { min-height: 38px; padding: 0 16px; }
}

main { flex: 1; display: grid; align-content: center; justify-items: start; gap: 22px; width: 100%; max-width: 1240px; margin: 0 auto; padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 40px); }
