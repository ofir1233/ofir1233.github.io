<style>
/* The site's v7 look: paper page, ink type in Byrd, blue as the one accent, the painted sky of the footer under the fold.
   Links are root-absolute because GitHub Pages serves this page at any missing path. */
@font-face{ font-family:"Byrd"; src:url("/fonts/Byrd-Regular.woff2") format("woff2"); font-weight:400; font-display:swap; }
@font-face{ font-family:"Byrd"; src:url("/fonts/Byrd-Medium.woff2") format("woff2"); font-weight:500; font-display:swap; }
@font-face{ font-family:"Byrd"; src:url("/fonts/Byrd-SemiBold.woff2") format("woff2"); font-weight:600; font-display:swap; }
@font-face{ font-family:"Byrd"; src:url("/fonts/Byrd-Bold.woff2") format("woff2"); font-weight:700; font-display:swap; }
:root{ --paper:#f4f3f1; --ink:#171b20; --text:#333a42; --mute:#464b52; --line:#d5d8db; --blue:#0b6fcf; --focus:#139ffd; color-scheme:light; }
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--paper); }
body{ min-height:100vh; min-height:100svh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font:400 17px/1.6 "Byrd", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; overflow-x:clip; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; border-radius:6px; }

.nav{ position:relative; z-index:2; }
.nav .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; height:72px; max-width:1240px; margin:0 auto; padding:0 40px; }
.brand{ font-weight:700; font-size:22px; letter-spacing:-.03em; }
.brand span{ color:var(--blue); }
.nav ul{ list-style:none; display:flex; align-items:center; gap:28px; font-size:15px; font-weight:500; }
.nav ul a{ display:inline-flex; align-items:center; min-height:42px; color:var(--mute); transition:color .2s; }
.nav ul a:hover{ color:var(--ink); }
.nav ul li:last-child a{ padding:0 20px; border-radius:99px; background:var(--ink); color:#fff; font-weight:600; }

main{ position:relative; z-index:1; flex:1; display:grid; align-content:start; justify-items:start; gap:22px; width:100%; max-width:1240px; margin:0 auto; padding:clamp(56px, 11vh, 132px) 40px 0; }
.label{ display:inline-flex; align-items:center; height:30px; padding:0 13px; border-radius:99px; background:#e6e8ea; color:var(--text); font:600 14px/1 "Byrd", sans-serif; }
h1{ font-weight:700; font-size:clamp(40px, 5.4vw, 72px); letter-spacing:-.04em; line-height:1.02; text-wrap:balance; }
h1 span{ color:var(--blue); }
main > p:not(.label){ max-width:46ch; color:var(--text); }
.cta{ display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
.btn{ display:inline-flex; align-items:center; gap:10px; height:50px; padding:0 22px; border-radius:99px; background:var(--ink); color:#fff; font-size:15px; font-weight:600; transition:background-color .25s, box-shadow .25s; }
.btn:hover{ background:#2a3038; }
.btn.ghost{ background:#fff; color:var(--ink); font-weight:500; box-shadow:inset 0 0 0 1px var(--line); }
.btn.ghost:hover{ background:#fff; box-shadow:inset 0 0 0 1px var(--ink); }

/* the footer's painted sky and harbour, rising out of the paper */
.sky{ position:relative; flex:none; height:clamp(220px, 44vh, 460px); margin-top:clamp(40px, 7vh, 88px); overflow:hidden; -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 46%); mask-image:linear-gradient(180deg, transparent 0, #000 46%); }
.sky img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 100%; }

@media (max-width:760px){
  .nav .wrap{ height:64px; padding:0 16px; }
  .nav ul{ gap:18px; }
  .nav ul li:last-child a{ padding:0 18px; }
  main{ padding:48px 16px 0; gap:18px; }
  /* on a phone the picture is enlarged from its foot, so the harbour is the subject and not a strip under a tall sky */
  .sky{ height:38vh; }
  .sky img{ inset:auto 0 0 0; height:168%; object-position:36% 100%; }
}
@media (max-width:359px){ .nav ul li:first-child{ display:none; } }
@media (prefers-reduced-motion:reduce){ .nav ul a, .btn{ transition:none; } }
</style>
</head>

    <ul>

    </ul>
  </div>
</nav>
<main id="main">
  <p class="label">404</p>
  <h1>This page was not found<span>.</span></h1>
  <p>The address may be old or mistyped. Everything on the site is one click from the homepage.</p>
  <div class="cta"><a class="btn" href="/">Go to the homepage</a><a class="btn ghost" href="/#design-lab">See the work</a></div>
</main>
<div class="sky" aria-hidden="true"><img src="/img/foot-sky-s.webp" alt="" width="1536" height="768" decoding="async"></div>
</body>
</html>
