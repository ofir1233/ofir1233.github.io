<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
  :root { --bg: #0c1210; --surface: #151d1a; --line: #2a3832; --text-1: #eef3f0; --text-2: #c3cfc9; --mute: #93a79c; --accent: #7cc4a6; --err: #ef8f7a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text-1); }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font: 400 17px/1.5 "Figtree", system-ui, sans-serif; overflow: hidden; }
  .glow { position: fixed; width: 1100px; aspect-ratio: 1; right: -380px; top: -420px; pointer-events: none; background: radial-gradient(closest-side, rgba(124,196,166,.14), rgba(124,196,166,.04) 55%, transparent 72%); animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(-120px, 90px) scale(1.08); } }
  main { position: relative; width: min(100%, 420px); animation: in 900ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  .kicker { margin: 0 0 18px; font: 500 13px/1 "Geist Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0 0 10px; font: 500 44px/1.02 "Bricolage Grotesque", sans-serif; letter-spacing: -.03em; }
  p.sub { margin: 0 0 34px; color: var(--text-2); }
  label { display: block; margin-bottom: 8px; font: 500 13px/1 "Geist Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .row { display: flex; gap: 10px; }
  input[type=password] { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text-1); font: 500 18px "Figtree", sans-serif; transition: border-color .2s; }
  input[type=password]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,196,166,.18); }
  button { height: 52px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent); color: #0c1210; font: 600 17px "Figtree", sans-serif; cursor: pointer; transition: transform .15s, opacity .2s; }
  button:active { transform: scale(.98); }
  button[disabled] { opacity: .6; cursor: progress; }
  .remember { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--text-2); font-size: 15px; text-transform: none; letter-spacing: 0; font-family: "Figtree", sans-serif; }
  .remember input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .msg { min-height: 24px; margin: 14px 0 0; font-size: 15px; color: var(--err); }
  .shake { animation: shake 360ms cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  noscript p { color: var(--err); }
  @media (prefers-reduced-motion: reduce) { .glow, main, .shake { animation: none; } }
</style>
</head>

<div class="glow" aria-hidden="true"></div>
<main>
  <p class="kicker">Presenter notes</p>
  <h1>Notes for the talk</h1>
  <p class="sub">Only for the person presenting.</p>
  <form id="gate" autocomplete="on">
    <input type="text" name="username" value="presenter" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <div class="row">
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="go">Open</button>
    </div>
    <label class="remember"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
    <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
  </form>
  <noscript><p>This page needs JavaScript to open.</p></noscript>
</main>

<script>
(() => {
  const ITER = 600000, SLOT = 'cs:key:7bb610b73b0bn';
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const raw = b64(document.getElementById('payload').textContent.trim());
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const subtle = crypto && crypto.subtle;
  const $ = id => document.getElementById(id);
  const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));

  const open = async keyBytes => {
    const key = await subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    const plain = await subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(plain);
  };
  const show = html => { document.open(); document.write(html); document.close(); };
  const store = (k, keep) => { try { (keep ? localStorage : sessionStorage).setItem(SLOT, k); } catch (e) {} };
  const stored = () => { try { return sessionStorage.getItem(SLOT) || localStorage.getItem(SLOT); } catch (e) { return null; } };

  const tryKey = async (k, keep) => {
    try { const html = await open(b64(k)); store(k, keep); show(html); return true; }
    catch (e) { try { sessionStorage.removeItem(SLOT); localStorage.removeItem(SLOT); } catch (x) {} return false; }
  };

  if (!subtle) { $('msg').textContent = 'This browser can’t open the page. Try a current Chrome, Safari or Firefox.'; return; }

  // a link can carry the key after #k= so the reader skips the password; it is removed from the address at once
  const m = location.hash.match(/[#&]k=([\w-]+)/);
  if (m) history.replaceState(null, '', location.pathname + location.search);
  const first = m ? m[1].replace(/-/g, '+').replace(/_/g, '/') : stored();
  // the page must finish parsing before it is replaced: written while the gate still parses, the page would land
  // inside the gate instead of replacing it (a reload, a #k= link or a stored key would open a broken mix of both)
  if (first) {
    const auto = () => tryKey(first, !!m);
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', () => setTimeout(auto, 0)); else auto();
  }

  $('gate').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true; $('go').textContent = 'Opening…'; $('msg').textContent = '';
    try {
      const base = await subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
      const bits = await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER }, base, 256);
      if (await tryKey(toB64(bits), $('remember').checked)) return;
    } catch (err) {}
    $('go').disabled = false; $('go').textContent = 'Open';
    $('msg').textContent = 'That password didn’t work. Check the message it came in.';
    const f = $('gate'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    $('pw').select();
  });
})();
</script>
